---
- name: Require declared target identity
  ansible.builtin.assert:
    that:
      - deploy_invariant_environment is defined
      - deploy_invariant_environment in ['production', 'lab']
      - deploy_invariant_expected_hostname is defined
      - deploy_invariant_expected_hostname is string
      - deploy_invariant_expected_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - >-
        deploy_invariant_expected_machine_id is not defined
        or deploy_invariant_expected_machine_id is none
        or
        (
          deploy_invariant_expected_machine_id is string
          and deploy_invariant_expected_machine_id is match('^[0-9a-f]{32}$')
        )
    fail_msg: >-
      PRE_MUTATION_REFUSAL: inventory must declare a safe expected hostname;
      expected_machine_id, when used, must be a 32-character lowercase hex ID.

- name: Read actual target hostname
  ansible.builtin.command:
    argv:
      - /bin/hostname
  register: deploy_invariant_actual_hostname
  changed_when: false
  check_mode: false

- name: Refuse an unexpected hostname
  ansible.builtin.assert:
    that:
      - deploy_invariant_actual_hostname.stdout == deploy_invariant_expected_hostname
    fail_msg: >-
      PRE_MUTATION_REFUSAL: actual hostname does not match the hostname
      declared by the selected inventory.

- name: Read stable machine identity when inventory pins it
  ansible.builtin.command:
    argv:
      - /usr/bin/cat
      - /etc/machine-id
  register: deploy_invariant_actual_machine_id
  changed_when: false
  check_mode: false
  when:
    - deploy_invariant_expected_machine_id is defined
    - deploy_invariant_expected_machine_id is not none

- name: Refuse an unexpected stable machine identity
  ansible.builtin.assert:
    that:
      - deploy_invariant_actual_machine_id.stdout == deploy_invariant_expected_machine_id
    fail_msg: >-
      PRE_MUTATION_REFUSAL: /etc/machine-id does not match the stable machine
      identity declared by the selected inventory.
  when:
    - deploy_invariant_expected_machine_id is defined
    - deploy_invariant_expected_machine_id is not none
