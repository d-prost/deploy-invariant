---
name: deploy-invariant-ops-demo

services:
  dozzle:
    image: ${DOZZLE_IMAGE:?Set immutable DOZZLE_IMAGE RepoDigest}
    container_name: deploy-invariant-ops-demo-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - deploy_invariant_ops_demo
    security_opt:
      - no-new-privileges:true

networks:
  deploy_invariant_ops_demo: {}
